# springchick config — sample with every option set to its built-in default.
#
# Copy to one of (first found wins):
#   $XDG_CONFIG_HOME/springchick/config.toml  (or ~/.config/springchick/config.toml)
#   /etc/springchick/config.toml
# or point SPRINGCHICK_CONFIG at a file to override the lookup entirely.
#
# Unknown keys are ignored; a bad keybinding is dropped with a warning and the
# rest of the config still applies. Values below match the compiled-in defaults,
# so this file changes nothing until you edit it.
#
# `springchick ipc reload` re-reads this file into a running compositor. Every
# option below takes effect immediately except `dpi` and `uclamp_min` (ignored
# on reload; both need a restart) and `prefer_no_csd` (applies to the next
# window that negotiates decorations).

[main]
# Output scale advertised to clients. The FP5 panel is dense enough that 1:1
# rendering is illegibly small. Advertised via wp_fractional_scale, so a
# fractional value (e.g. 2.5) is allowed, not just whole numbers.
# NOT reloadable: a running compositor keeps the value it started with.
dpi = 3

# Seconds of no input before the panel idle-blanks. 0 disables idle blanking
# (the power button still blanks on demand).
idle_blank_secs = 600

# Base corner radius (logical px) for shrunken app cards: switcher deck and the
# drag-lift card. Other card radii scale proportionally from this.
card_radius = 120.0

# Draw a visual indicator under each touch/pointer contact (a filled disc plus a
# fading ring on release). Off by default; turn on for demo recordings.
show_touches = false

# Prefer server-side (= no client) decorations for top-level app windows, for a
# borderless phone look. Child windows (dialogs) always keep client-side
# decorations regardless, so toolkits like GTK still draw the header bar that
# holds a file chooser's Open/Cancel buttons. Set false to let apps draw their
# own titlebars.
prefer_no_csd = true

# Scheduler utilization floor (util_min, 0..=1024) held on the render thread
# while it is drawing, and dropped shortly after it settles.
#
# Why: on a big.LITTLE phone the render thread's tracked utilization decays
# while the screen is idle, so schedutil parks it on the little cluster at a low
# frequency. Short interactions — a tap, a flick — then finish before the
# governor ramps, so every frame in them is slow, not just the first. Measured
# on the FP5 (11.11ms budget at 90Hz), first frame after 12s idle went 11.78ms
# (6/6 over budget) -> 8.88ms (0/6 over), and follow-up frames 10.21ms -> 4.01ms.
#
#   "auto"  derive from CPU topology: just above the little cluster's
#           cpu_capacity, which is where the migration knee sits. Disables
#           itself when all CPUs have the same capacity (nothing to move to).
#   "off"   leave the scheduler alone. 0 means the same.
#   <n>     an explicit floor, e.g. 450 on the FP5 (little cluster is 382).
#
# Read at startup only — `springchick ipc reload` will not pick this up.
uclamp_min = "auto"

[keybinds]
# Long-press threshold (ms): how long a button is held before its "long" action
# fires instead of its "short" one.
long_press_ms = 800

# Each binding needs `key` (xkb keysym name) and `press` ("short" or "long"),
# plus exactly one of `action` (built-in) or `command` (run through `sh -c`).
# Optional `mods` = list of ["Ctrl", "Alt", "Shift", "Super"].
#
# Built-in actions: close-app, home, toggle-display, volume-up, volume-down,
# volume-mute, toggle-fullscreen, search, switcher-next, switcher-prev.
#
# switcher-next / switcher-prev are meant to be bound with Super held: each
# press steps the deck one card, and releasing Super opens the focused one.

[[keybinds.binding]]
key = "XF86AudioRaiseVolume"
press = "short"
action = "volume-up"

[[keybinds.binding]]
key = "XF86AudioRaiseVolume"
press = "long"
action = "close-app"

[[keybinds.binding]]
key = "XF86AudioLowerVolume"
press = "short"
action = "volume-down"

[[keybinds.binding]]
key = "XF86AudioLowerVolume"
press = "long"
command = "pkill -SIGRTMIN -f wvkbd-mobintl"

[[keybinds.binding]]
key = "XF86PowerOff"
press = "short"
action = "toggle-display"

[[keybinds.binding]]
key = "XF86PowerOff"
press = "long"
command = "systemctl poweroff"

[[keybinds.binding]]
key = "h"
mods = ["Super"]
press = "short"
action = "home"

[[keybinds.binding]]
key = "f"
mods = ["Super"]
press = "short"
action = "toggle-fullscreen"

[[keybinds.binding]]
key = "s"
mods = ["Super"]
press = "short"
action = "search"

[[keybinds.binding]]
key = "Tab"
mods = ["Super"]
press = "short"
action = "switcher-next"

# Shift turns Tab into ISO_Left_Tab, so the reverse step binds that keysym.
[[keybinds.binding]]
key = "ISO_Left_Tab"
mods = ["Super", "Shift"]
press = "short"
action = "switcher-prev"
