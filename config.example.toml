# springchick config. Every option is set to its built-in default, so this
# file changes nothing until you edit it.
#
# Lookup (first found wins): $SPRINGCHICK_CONFIG, then
# $XDG_CONFIG_HOME/springchick/config.toml (or ~/.config/...), then
# /etc/springchick/config.toml.
#
# Unknown keys are ignored; a bad entry is dropped with a warning and the rest
# still applies. `springchick ipc reload` applies changes live, except `dpi`,
# `uclamp_min` and `vrr` (restart needed) and `prefer_no_csd` (new windows only).
[main]
# Shell commands run via `sh -c` once the Wayland socket exists.
# startup = [
#   "wvkbd-mobintl --hidden",
#   "mako",
# ]

# Output scale advertised to clients. Fractional values (e.g. 2.5) work.
dpi = 3

# Seconds without input before the panel blanks. 0 disables.
idle_blank_secs = 600

# Corner radius (logical px) of shrunken app cards; other radii scale from it.
card_radius = 120.0

# How long (ms) the accelerometer must hold an orientation before a fullscreen
# app turns, so a wobble past the diagonal doesn't flip it. 0 turns at once.
rotation_settle_ms = 400

# Half-duration (ms) of the fade to black around a rotation. 0 swaps instantly.
rotation_fade_ms = 130

# Draw a marker under each touch/pointer contact, for demo recordings.
show_touches = false

# Touchpad content follows the fingers. Mouse wheels are unaffected.
natural_scroll = true

# Ask top-level windows to drop their titlebars. Dialogs always keep theirs,
# so GTK file choosers still show Open/Cancel.
prefer_no_csd = true

# Scheduler util_min floor (0..=1024) on the render thread while drawing.
# Without it, idle decays the thread onto the little cores and short
# interactions finish before the governor ramps up.
#   "auto"  just above the little cluster's cpu_capacity; off on symmetric CPUs
#   "off"   no floor (same as 0)
#   <n>     explicit, e.g. 450 on the FP5 (little cluster is 382)
uclamp_min = "auto"

# Variable refresh rate, so a static screen lets the panel slow down. Only
# applies when the log shows "connector supports VRR" at startup.
vrr = true

# Per-app resource limits, set on each app's systemd scope on focus change.
# Needs the cpu (and memory) controllers delegated to user@.service:
#   cat /sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers
[resources]
enable = true

# CPUWeight for the focused app and for the rest. Only matters under
# contention; the compositor itself runs at 200.
fg_cpu_weight = 100
bg_cpu_weight = 20

# CPUQuota for background apps, as a percentage of one core (over 100% is
# allowed). This is what saves battery: a weight does nothing for an app
# spinning alone. Shared by all of an app's processes, so too low slows real
# background work (audio, downloads, sync).
bg_cpu_quota = "30%"

# AllowedCPUs for background apps.
#   "auto"  the lowest-capacity CPUs, detected per device; off on symmetric CPUs
#   "off"   leave placement to the scheduler
#   "0-3"   an explicit list
# Needs cpuset delegated (the NixOS module does this); otherwise the log says
# "cpuset not delegated" and only pinning is skipped.
bg_allowed_cpus = "auto"

# MemoryHigh for background apps: throttle and reclaim, never kill. Set below
# real usage it reclaims constantly and costs power, so measure first
# (`systemctl --user show <scope> -p MemoryCurrent`). "512M" is a reasonable
# start on a 6-8GB phone.
bg_memory_high = "infinity"

[keybinds]
# Hold time (ms) before a "long" binding fires instead of "short".
long_press_ms = 800

# Each binding: `key` (xkb keysym), `press` ("short", the default, or "long"), and either
# `action` or `command` (run via `sh -c`). Optional `mods`: any of
# "Ctrl", "Alt", "Shift", "Super".
#
# Actions: close-app, home, toggle-display, volume-up, volume-down,
# volume-mute, toggle-fullscreen, search, switcher-next, switcher-prev,
# screenshot (PNG to the clipboard).
#
# Bind switcher-next/prev with Super: each press steps the deck, releasing
# Super opens the focused card.

[[keybinds.binding]]
key = "XF86AudioRaiseVolume"
action = "volume-up"

[[keybinds.binding]]
key = "XF86AudioRaiseVolume"
press = "long"
action = "close-app"

[[keybinds.binding]]
key = "XF86AudioLowerVolume"
action = "volume-down"

[[keybinds.binding]]
key = "XF86AudioLowerVolume"
press = "long"
command = "pkill -SIGRTMIN -f wvkbd-mobintl"

[[keybinds.binding]]
key = "XF86PowerOff"
action = "toggle-display"

[[keybinds.binding]]
key = "XF86PowerOff"
press = "long"
command = "systemctl poweroff"

[[keybinds.binding]]
key = "h"
mods = ["Super"]
action = "home"

[[keybinds.binding]]
key = "f"
mods = ["Super"]
action = "toggle-fullscreen"

[[keybinds.binding]]
key = "s"
mods = ["Super"]
action = "search"

[[keybinds.binding]]
key = "Print"
action = "screenshot"

[[keybinds.binding]]
key = "Tab"
mods = ["Super"]
action = "switcher-next"

# Shift turns Tab into ISO_Left_Tab, so the reverse step binds that keysym.
[[keybinds.binding]]
key = "ISO_Left_Tab"
mods = ["Super", "Shift"]
action = "switcher-prev"
