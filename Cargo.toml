[workspace]
resolver = "2"
members = [
  "crates/sc-anim",
  "crates/sc-input",
  "crates/sc-config",
  "crates/sc-keys",
  "crates/sc-shell-model",
  "crates/sc-catalog",
  "crates/sc-layout",
  "crates/sc-icons",
  "crates/sc-search",
  "crates/sc-compositor",
]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# TEMPORARY (duplicate-keyboard hunt): local smithay with the input-method
# activate/deactivate dedupe. Not for merge — see nix/smithay-im-dedupe.patch.
[patch."https://github.com/Smithay/smithay.git"]
smithay = { path = "/home/marcus/Source/smithay" }
