name: springchick
arch: ${PKG_ARCH}
version: ${PKG_VERSION}
release: ${PKG_RELEASE}
section: x11
priority: optional
maintainer: Marcus Ramberg <marcus.ramberg@gmail.com>
description: |
  iOS Springboard-style Wayland compositor for mobile Linux.
vendor: springchick
homepage: https://code.bas.es/marcus/springchick
license: GPL-2.0-only

# Top-level list is the Arch one; deb and apk override it below.
depends:
  - wayland
  - libxkbcommon
  - libinput
  - mesa
  - seatd
  - systemd-libs
  - dbus
  - pam
  - fontconfig
  - freetype2
  - zlib

overrides:
  deb:
    depends:
      - libwayland-client0
      - libwayland-server0
      - libxkbcommon0
      - libinput10
      - libgbm1
      - libegl1
      - libgles2
      - libudev1
      - libseat1
      - libdbus-1-3
      - libpam0g
      - libfontconfig1
      - libfreetype6
      - zlib1g
    recommends:
      - xwayland
      - xdg-desktop-portal-gnome
      # sc-bar: wpctl for the volume, gsettings for dark mode, and its
      # long-press defaults (foot sh -c nmtui). Debian has no bluetui.
      - wireplumber
      - libglib2.0-bin
      - foot
      - network-manager
  apk:
    depends:
      - wayland-libs-client
      - wayland-libs-server
      - libxkbcommon
      - libinput
      - mesa-gbm
      - mesa-egl
      - mesa-gles
      - eudev-libs
      - libseat
      - dbus-libs
      - linux-pam
      - fontconfig
      - freetype
      - zlib
  archlinux:
    recommends:
      - xorg-xwayland
      - xdg-desktop-portal-gnome
      # sc-bar: see the deb list.
      - wireplumber
      - glib2
      - foot
      - networkmanager
      - bluetui

contents:
  - src: ${PKG_BIN}/springchick
    dst: /usr/bin/springchick
  - src: ${PKG_BIN}/sc-search
    dst: /usr/bin/sc-search
  - src: ${PKG_BIN}/sc-osk
    dst: /usr/bin/sc-osk
  - src: ${PKG_BIN}/sc-bar
    dst: /usr/bin/sc-bar
  - src: ${PKG_BIN}/springchick-session
    dst: /usr/bin/springchick-session
  - src: nix/springchick.desktop
    dst: /usr/share/wayland-sessions/springchick.desktop
  - src: config.example.toml
    dst: /usr/share/springchick/config.example.toml
  # Inter is built into the binaries; the OFL travels with it.
  - src: crates/sc-fonts/Inter-LICENSE.txt
    dst: /usr/share/licenses/springchick/Inter-LICENSE.txt
  # sc-bar's symbols are Lucide's.
  - src: crates/sc-bar/LICENSE-lucide
    dst: /usr/share/licenses/springchick/LICENSE-lucide
  - src: packaging/files/springchick-portals.conf
    dst: /usr/share/xdg-desktop-portal/springchick-portals.conf

  # systemd session plumbing. Shipped everywhere: postmarketOS is systemd now,
  # and springchick-session needs the Type=notify unit to raise
  # graphical-session.target.
  - src: packaging/files/springchick.service
    dst: /usr/lib/systemd/user/springchick.service
  - src: packaging/files/springchick-shutdown.target
    dst: /usr/lib/systemd/user/springchick-shutdown.target
  # The status bar, on with the session on every distro. A .wants symlink: no
  # user manager runs at install time to enable it. `systemctl --user mask
  # sc-bar.service` makes room for another bar.
  - src: packaging/files/sc-bar.service
    dst: /usr/lib/systemd/user/sc-bar.service
  - dst: /usr/lib/systemd/user/springchick.service.wants/sc-bar.service
    type: symlink
    src: ../sc-bar.service
  # sc-bar's lock screen checks the PIN against the login password, by each
  # distro's own stack.
  - src: packaging/files/pam-debian
    dst: /etc/pam.d/springchick
    type: config|noreplace
    packager: deb
  - src: packaging/files/pam-alpine
    dst: /etc/pam.d/springchick
    type: config|noreplace
    packager: apk
  - src: packaging/files/pam-arch
    dst: /etc/pam.d/springchick
    type: config|noreplace
    packager: archlinux
  # cpuset delegation for [resources].bg_allowed_cpus; systemd's own
  # Delegate= list is replaced, not extended, so its four defaults repeat.
  - src: packaging/files/50-springchick-cpuset.conf
    dst: /usr/lib/systemd/system/user@.service.d/50-springchick-cpuset.conf
  - src: packaging/files/70-springchick-gpu-boost.rules
    dst: /usr/lib/udev/rules.d/70-springchick-gpu-boost.rules
  - src: packaging/files/springchick-cpufreq.conf
    dst: /usr/lib/tmpfiles.d/springchick-cpufreq.conf
  - src: packaging/files/70-springchick-uinput.rules
    dst: /usr/lib/udev/rules.d/70-springchick-uinput.rules
