[package]
name = "sc-bar"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
sc-anim = { path = "../sc-anim" }
sc-catalog = { path = "../sc-catalog" }
sc-config = { path = "../sc-config" }
sc-fonts = { path = "../sc-fonts" }
sc-haptics = { path = "../sc-haptics" }
sc-icons = { path = "../sc-icons" }
sc-layout = { path = "../sc-layout" }
# libdbus bindings, as sc-compositor uses.
dbus = "0.9"
libc = "0.2"
rustix = { version = "1", features = ["event"] }
skia-safe = { version = "0.99", features = ["gl"] }
smithay-client-toolkit = { version = "0.21", default-features = false }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
