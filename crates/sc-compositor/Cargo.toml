[package]
name = "sc-compositor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "springchick"
path = "src/main.rs"

[dependencies]
sc-anim = { path = "../sc-anim" }
sc-input = { path = "../sc-input" }
sc-config = { path = "../sc-config" }
sc-shell-model = { path = "../sc-shell-model" }
sc-catalog = { path = "../sc-catalog" }
sc-layout = { path = "../sc-layout" }
sc-icons = { path = "../sc-icons" }
sc-keys = { path = "../sc-keys" }

# Upstream smithay@7ddcd17 (needed for xkbcommon 0.9 → wvkbd keymap fix).
#
# `use_system_lib` (libwayland-server rather than the pure-Rust wayland-backend)
# is load-bearing, not an optimisation. Several smithay role handlers post a
# protocol error from a surface's pre-commit hook after the role object is gone
# — the "destroy role → attach nil → commit" teardown every Qt/quickshell client
# does. The Rust backend delivers that error on the dead object and kills the
# client (layer surfaces: Smithay#1979, `width 0 requested…`, dms panel close;
# lock surfaces: `Committed before the first ack_configure.`, dms unlock);
# libwayland drops it. Dropping this feature resurrects both crashes.
smithay = { git = "https://github.com/Smithay/smithay.git", rev = "7ddcd1736b47255ac209ddbc7c477fe69b4a9807", default-features = false, features = [
  "use_system_lib",
  "backend_winit",
  "backend_egl",
  "renderer_gl",
  "renderer_multi",
  "backend_drm",
  "backend_gbm",
  "backend_udev",
  "backend_libinput",
  "backend_session_libseat",
  "wayland_frontend",
  "desktop",
  "xwayland",
] }

# libinput / DRM / session types are used via smithay's re-exports
# (smithay::reexports::{input, drm, gbm, ...}) to avoid version skew.
libc = "0.2"

# iio-sensor-proxy client (accelerometer orientation) over the system bus.
# Bindings to libdbus rather than a pure-Rust stack: 3 transitive crates against
# zbus's 142, for one interface read from one worker thread.
dbus = "0.9"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

skia-safe = { version = "0.99", features = ["gl"] }
# Matches smithay's calloop (0.14); the `signals` feature enables SIGTERM
# handling on the event loop we get via smithay::reexports::calloop (feature
# unification). Not imported directly — see drm_backend's signal source.
calloop = { version = "0.14", features = ["signals"] }

# Type=notify readiness handshake with the systemd user service that runs us
# (springchick.service). Pure-Rust, no libsystemd link. No-ops when
# NOTIFY_SOCKET is unset (bare VT launch), so it is safe in every backend.
sd-notify = "0.4"

[dev-dependencies]
tempfile = "3"
