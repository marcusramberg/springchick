[package]
name = "sc-compositor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "springchick"
path = "src/main.rs"

[dependencies]
sc-anim = { path = "../sc-anim" }
sc-input = { path = "../sc-input" }
sc-shell-model = { path = "../sc-shell-model" }
sc-config = { path = "../sc-config" }
sc-layout = { path = "../sc-layout" }
sc-icons = { path = "../sc-icons" }
sc-keys = { path = "../sc-keys" }

smithay = { version = "0.7", default-features = false, features = [
  "backend_winit",
  "backend_egl",
  "renderer_gl",
  "renderer_multi",
  "backend_drm",
  "backend_gbm",
  "backend_udev",
  "backend_libinput",
  "backend_session_libseat",
  "wayland_frontend",
  "desktop",
  "xwayland",
] }

# libinput / DRM / session types are used via smithay's re-exports
# (smithay::reexports::{input, drm, gbm, ...}) to avoid version skew.
libc = "0.2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

skia-safe = { version = "0.99", features = ["gl"] }
calloop = "0.14"

[dev-dependencies]
tempfile = "3"
